[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "pygpsclient"
dynamic = ["version"]
authors = [{ name = "Steve Smith" }, { email = "semuadmin@semuconsulting.com" }]
maintainers = [
    { name = "Steve Smith" },
    { email = "semuadmin@semuconsulting.com" },
]
description = "GNSS Receiver Testing, Diagnostic and Configuration GUI Application"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "BEIDOU",
    "DGPS",
    "GALILEO",
    "GIS",
    "GLONASS",
    "GNSS",
    "GPS",
    "NAVIC",
    "NMEA",
    "NTRIP",
    "PyGPSClient",
    "Quectel",
    "QZSS",
    "RINEX",
    "RTCM",
    "RTK",
    "Septentrio",
    "SPARTN",
    "u-blox",
    "u-center",
    "UBX",
    "Unicore",
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "certifi>=2026.0.0",
    "pillow>=12.0.0",
    "pygnssutils>=1.3.1",
    "pynmeagps>=1.1.9",
    "pyqgc>=1.0.1",
    "pyrtcm>=1.2.1",
    "pysbf2>=1.0.7",
    "pyserial>=3.5",
    "pyspartn>=1.1.2",
    "pyubx2>=1.4.1",
    "pyubxutils>=1.0.6",
    "pyunigps>=1.0.1",
    "requests>=2.34.0",
]

[project.scripts]
pygpsclient = "pygpsclient.__main__:main"

[project.urls]
homepage = "https://github.com/semuconsulting/PyGPSClient"
documentation = "https://www.semuconsulting.com/pygpsclient/"
repository = "https://github.com/semuconsulting/PyGPSClient"
changelog = "https://github.com/semuconsulting/PyGPSClient/blob/main/RELEASE_NOTES.md"

[dependency-groups]
optional = ["rasterio", "psutil", "cryptography>=45.0.0"]
build = [
    "awscli",
    "Babel",
    "build",
    "packaging>=24.2",
    "pip>=26.2.2",
    "setuptools>=75.0.0",
    "twine>=6.1.0",
    "wheel",
]
test = [
    "bandit",
    "black",
    "certifi>=2026.10.19",
    "isort",
    "pylint",
    "pytest",
    "pytest-cov",
    "Sphinx",
    "sphinx-rtd-theme",
]
deploy = [{ include-group = "build" }, { include-group = "test" }]

[tool.setuptools.dynamic]
version = { attr = "pygpsclient._version.__version__" }

[tool.black]
target-version = ['py311']

[tool.isort]
py_version = 311
profile = "black"

[tool.bandit]
exclude_dirs = []
skips = []

[tool.pylint]
jobs = 0
reports = "y"
recursive = "y"
py-version = "3.11"
fail-under = "9.9"
fail-on = "E,F"
clear-cache-post-run = "y"
good-names = "i,j,x,y"
disable = """
    raw-checker-failed,
    bad-inline-option,
    locally-disabled,
    file-ignored,
    suppressed-message,
    useless-suppression,
    deprecated-pragma,
    use-symbolic-message-instead,
    too-many-instance-attributes,
    too-many-ancestors,
    unused-private-member,
    too-few-public-methods,
    too-many-public-methods,
    too-many-locals,
    invalid-name,
    logging-fstring-interpolation,
"""

[tool.babel]
[[tool.babel.mappings]]
method = "python"
pattern = "**/*.py"
keywords = ["_", "_l", "_n:1,2"]
Project-Id-Version = "1.8.1"
Report-Msgid-Bugs-To = "semuadmin@semuconsulting.com"
Last-Translator = "Steve Smith <semuadmin@semuconsulting.com"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov --cov-report html --cov-fail-under 22"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
fail_under = 22

[tool.coverage.html]
directory = "htmlcov"
